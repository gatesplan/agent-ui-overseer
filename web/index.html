<!doctype html>
<html lang="ko" data-theme="future-industry">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overseer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="themes/future-industry.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-mark"></span>OVERSEER <span class="mock-tag">MOCK</span></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="views" role="tablist">
    <button id="toggle-term" title="원문 터미널 패널">터미널</button>
    <button class="icon-btn" data-drawer="global" title="전역 설정" aria-label="전역 설정">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
</header>

<main class="layout" id="layout">
  <section class="mod-host" id="modhost"></section>
  <section class="pane-main" id="main"></section>
  <aside class="drawer" id="drawer"></aside>
  <aside class="pane-term" id="term" hidden>
    <div class="term-head"><span id="term-title"></span><span class="term-note">PTY 자리 / 기록 재생</span></div>
    <pre class="term-body" id="term-body"></pre>
  </aside>
</main>



<dialog class="newtab" id="newtab">
  <form>
    <div class="ps-title">새 세션</div>
    <label class="nt-row"><span>작업 폴더</span>
      <input name="q" placeholder="검색, 새 폴더 이름, 또는 전체 경로" autocomplete="off" spellcheck="false"></label>
    <div class="nt-list" id="nt-list"></div>
    <label class="nt-check"><input type="checkbox" name="skip" checked>
      <span><code>--dangerously-skip-permissions</code><small>권한 확인 없이 띄운다. 끄면 확인은 터미널 창에서 응답한다</small></span></label>
    <div class="nt-actions">
      <button type="button" data-nt="cancel">취소</button>
      <button type="button" data-nt="open" class="primary">열기</button>
    </div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
<script src="mock-data.js"></script>
<script src="mock-modules.js"></script>
<script src="module-panel.js"></script>
<script src="app.js"></script>
</body>
</html>
