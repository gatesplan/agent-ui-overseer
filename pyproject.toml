[project]
name = "project-manager"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["loguru", "pywinpty", "aiohttp"]

[project.scripts]
overseer = "project_manager:OverseerServer.cli"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project_manager"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
