[project]
name = "project-overseer"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "loguru",
    "aiohttp",
    "pywinpty; sys_platform == 'win32'",
    "mcp>=2.3.0",
    # 모듈 패널의 지도(lnt map --json). 같은 환경의 lnt 를 쓴다
    "ff-lntools>=0.4.1",
]

[project.scripts]
overseer = "project_manager:OverseerServer.cli"
# 훅 등록, 점검, 제거
overseer-setup = "project_manager.l1.hook_installer:HookInstaller.main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project_manager"]

# 설치한 패키지만으로 돌게 화면, 규약, 훅과 MCP 스크립트를 패키지 안 _assets 에 담는다(InstallLayout 이 찾는다)
[tool.hatch.build.targets.wheel.force-include]
"web" = "project_manager/_assets/web"
"docs/item-protocol.md" = "project_manager/_assets/item-protocol.md"
"scripts/capture_hook.py" = "project_manager/_assets/scripts/capture_hook.py"
"scripts/overseer_mcp.py" = "project_manager/_assets/scripts/overseer_mcp.py"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
